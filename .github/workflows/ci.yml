name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-skills:
    name: Validate Skills & Scaffolding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate SKILL.md frontmatter and references
        run: |
          python3 - << 'EOF'
          import glob, os, sys, re

          errors = []
          for skill_path in glob.glob('skills/*/SKILL.md'):
              folder = os.path.basename(os.path.dirname(skill_path))
              content = open(skill_path).read()
              
              # Validate frontmatter
              if not content.startswith('---'):
                  errors.append(f"{skill_path}: missing frontmatter header '---'")
                  continue
              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f"{skill_path}: invalid frontmatter format")
                  continue
              
              frontmatter = parts[1]
              name_match = re.search(r'^name:\s*(.+)$', frontmatter, re.MULTILINE)
              desc_match = re.search(r'^description:\s*(.+)$', frontmatter, re.MULTILINE)
              
              if not name_match:
                  errors.append(f"{skill_path}: missing 'name' in frontmatter")
              elif name_match.group(1).strip() != folder:
                  errors.append(f"{skill_path}: name '{name_match.group(1).strip()}' does not match folder '{folder}'")
              
              if not desc_match:
                  errors.append(f"{skill_path}: missing 'description' in frontmatter")
              else:
                  desc_len = len(desc_match.group(1).strip())
                  if desc_len >= 1024:
                      errors.append(f"{skill_path}: description length {desc_len} exceeds 1024 characters limit")
              
              # Validate referenced files in the skill directory
              skill_dir = os.path.dirname(skill_path)
              ref_matches = re.findall(r'`(references/[a-zA-Z0-9_\-\.]+)|`(assets/[a-zA-Z0-9_\-\./]+)', content)
              for ref_tuple in ref_matches:
                  ref = ref_tuple[0] or ref_tuple[1]
                  ref_full = os.path.join(skill_dir, ref)
                  if not os.path.exists(ref_full):
                      errors.append(f"{skill_path}: referenced file '{ref}' not found at '{ref_full}'")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All SKILL.md frontmatter and file references validated successfully.")
          EOF

      - name: Verify deterministic scaffolding runner
        run: |
          # Note: Integration testing with Testcontainers requires a running Docker daemon.
          # Here we verify standard solution generation, Central Package Management, and dual Debug/Release compilation.
          dotnet run skills/dotnet-scaffold/scripts/scaffold.cs -- -n CiVerification -o /tmp/ci-verify
          cd /tmp/ci-verify
          dotnet build -c Debug
          dotnet test -c Debug
          dotnet build -c Release
          dotnet test -c Release
